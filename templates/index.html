<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        img {
            height: 300px;
            margin: -50px;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-upload {
            background-color: #007bff;
            color: white;
            width: 100%;
        }
        .btn-upload:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card p-4">
            <div class="text-center">
            <img src="{% static 'img/logo_apostilla.png' %}" alt="logo">
            </div>
            <h3 class="text-center">Firmar Traducciones </h3>
            <p class="text-center text-muted">Sube un archivo Word (.docx), elige la firma y lo convertiremos a PDF con el pie de página.</p>

            <form action="{% url 'firmar_documento' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="archivo" class="form-label">Selecciona tu documento:</label>
                    <input class="form-control" type="file" id="archivo" name="archivo" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>

                </div>

                <div class="mb-3">
                    <label for="firma" class="form-label">Elige una firma:</label>
                    <select class="form-control" id="firma" name="firma" required>
                        <!-- <option value="" >Seleccione una firma</option> -->
                        <option value="firma_ingles.png">Inglés</option>
                        <option value="firma_aleman.png">Alemán</option>
                        <option value="firma_frances.png">Frances</option>
                        <option value="firma_italiano.png">Italiano</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-upload">Firmar Documento</button>

                {% if error %}
                    <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}

            </form>
        </div>
        <div class="text-center">
            <em class="text-muted">App - firmar_traduccion version 1.0 - 2025</em>
        </div>

    </div>

    <script>
        document.getElementById('archivo').addEventListener('change', function () {
            if (this.files[0]) {
                let fileName = this.files[0].name;
                let fileExt = fileName.split('.').pop().toLowerCase();
                if (fileExt !== "docx") {
                    alert("Solo se permiten archivos .docx");
                    this.value = ""; // Resetear el input
                }
            }
        });
    </script>
</body>
</html>
